version: "3.8"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: huongnghiep-vn
    restart: unless-stopped
    # Don't bind to host port 80 — Dokploy/Traefik routes internally
    expose:
      - "80"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.huongnghiep.rule=Host(`huongnghiep.vn`)"
      - "traefik.http.routers.huongnghiep.entrypoints=websecure"
      - "traefik.http.routers.huongnghiep.tls.certResolver=letsencrypt"
      - "traefik.http.services.huongnghiep.loadbalancer.server.port=80"
