name: Daily Admission Data Crawl

on:
  schedule:
    # Run daily at 02:00 UTC (09:00 Vietnam time)
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger'
        required: false
        default: 'Manual crawl'

jobs:
  crawl-and-commit:
    name: Crawl TuyenSinh247 → Commit → Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run crawler — TuyenSinh247 benchmark scores
        run: pnpm run crawl:daily

      - name: Check for data changes
        id: changes
        run: |
          git diff --name-only src/data/tuyensinh247_school_benchmarks.json > /tmp/changed.txt
          if [ -s /tmp/changed.txt ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Data file updated."
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes in benchmark data."
          fi

      - name: Commit updated data
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config --local user.email "crawler@huongnghiep.vn"
          git config --local user.name "HuongNghiep Crawler Bot"
          git add src/data/tuyensinh247_school_benchmarks.json
          git commit -m "chore(data): tuyensinh247 crawl $(date -u +'%Y-%m-%d')"

      - name: Push changes
        if: steps.changes.outputs.has_changes == 'true'
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}

      - name: Trigger Dokploy rebuild
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          if [ -n "${{ secrets.DOKPLOY_WEBHOOK_URL }}" ]; then
            curl -X POST "${{ secrets.DOKPLOY_WEBHOOK_URL }}" \
              -H "Content-Type: application/json" \
              -d "{\"event\":\"data_updated\",\"date\":\"$(date -u +'%Y-%m-%d')\"}" \
              --silent --fail
            echo "✅ Dokploy rebuild triggered."
          else
            echo "ℹ️  DOKPLOY_WEBHOOK_URL not set — skipping rebuild trigger."
          fi

      - name: Job summary
        run: |
          echo "## 📊 TuyenSinh247 Crawl Result" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          SCHOOLS=$(node -e "const d=require('./src/data/tuyensinh247_school_benchmarks.json'); console.log(d.totalSchoolsCount)")
          MAJORS=$(node -e "const d=require('./src/data/tuyensinh247_school_benchmarks.json'); const t=d.schools.reduce((s,r)=>s+r.majorsCount,0); console.log(t.toLocaleString())")
          CRAWLED=$(node -e "const d=require('./src/data/tuyensinh247_school_benchmarks.json'); console.log(d.crawledAt)")
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Schools | $SCHOOLS |" >> $GITHUB_STEP_SUMMARY
          echo "| Total Majors | $MAJORS |" >> $GITHUB_STEP_SUMMARY
          echo "| Crawled At | $CRAWLED |" >> $GITHUB_STEP_SUMMARY
          echo "| Data Changed | ${{ steps.changes.outputs.has_changes }} |" >> $GITHUB_STEP_SUMMARY
