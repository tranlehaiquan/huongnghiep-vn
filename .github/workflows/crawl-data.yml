name: Crawl Data Pipeline

on:
  schedule:
    # Runs every day at 02:00 UTC (09:00 AM ICT)
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      run_build_check:
        description: 'Run build validation check before committing'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  crawl-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: 📥 Install dependencies
        run: pnpm install

      - name: 🚀 Run crawl & data enrichment pipeline
        run: pnpm run crawl:all

      - name: 🏗️ Verify Astro build
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_build_check }}
        run: pnpm run build

      - name: 💾 Commit & Push updated dataset
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore(data): auto-update crawled university datasets [skip ci]'
          file_pattern: 'src/data/*.json'
          commit_user_name: 'github-actions[bot]'
          commit_user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_author: 'github-actions[bot] <github-actions[bot]@users.noreply.github.com>'
